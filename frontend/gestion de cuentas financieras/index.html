<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estado de cuentas | Imperio</title><link rel="stylesheet" href="estilos.css"><script defer src="../compartido/usuarios.js"></script><script defer src="../compartido/sesion.js"></script><script defer src="../compartido/datos.js"></script><script defer src="../compartido/navegacion.js"></script><script defer src="../compartido/operaciones.js"></script><script defer src="../compartido/pantallas.js"></script><script defer src="script.js"></script></head><body data-modulo="finanzas"><aside class="barraLateral"></aside><main><header><h1>Estado de cuentas</h1><button class="primario" id="nuevo">+ Nuevo registro</button></header><p id="mensajeEstado" role="status" aria-live="polite"></p><div class="indicadores"><article class="indicador"><span>Caja Fija (Efectivo)</span><strong id="caja">0</strong></article><article class="indicador"><span>Cuenta Bancaria Principal</span><strong id="banco">0</strong></article><article class="indicador"><span>Fondo para Proveedores</span><strong id="proveedores">0</strong></article><article class="indicador"><span>Balance Total</span><strong id="balance">0</strong></article></div><p id="legado" class="ayuda" hidden></p><h2>Últimos movimientos financieros</h2><div class="contenedorTabla"><table id="tabla"></table></div><p class="ayuda">Saldos calculados con ingresos menos egresos vigentes. Selecciona un concepto para consultar el detalle o anularlo.</p><dialog id="dialogo"><h2 id="tituloDialogo">Nuevo registro</h2><form id="formulario"><div class="campos"><label>Fecha<input id="fecha" type="date" required></label><label>Tipo<select id="tipo"><option value="ingreso">Ingreso</option><option value="egreso">Egreso</option></select></label><label>Concepto<input id="concepto" type="text" maxlength="160" required></label><label>Monto MXN<input id="importe" type="number" min="0.01" step="0.01" required></label><label>Cuenta<select id="cuenta"><option value="Caja Fija">Caja Fija</option><option value="Cuenta Bancaria Principal">Cuenta Bancaria Principal</option><option value="Fondo para Proveedores">Fondo para Proveedores</option></select></label><label>Clasificación<select id="categoria"><option value="Otros">Otros</option><option value="Venta">Venta</option><option value="Compra de insumos">Compra de insumos</option><option value="Depósito">Depósito</option></select></label></div><p id="mensajeDialogo" role="alert"></p><div class="acciones"><button class="primario">Guardar</button><button id="cancelar" type="button">Cancelar</button></div></form></dialog><dialog id="detalle"><h2>Detalle del movimiento</h2><p id="textoDetalle"></p><label>Motivo de anulación<input id="motivo" maxlength="160"></label><p id="errorDetalle" role="alert"></p><div class="acciones"><button id="anular">Anular registro</button><button id="cerrarDetalle">Cerrar</button></div></dialog></main></body></html>
