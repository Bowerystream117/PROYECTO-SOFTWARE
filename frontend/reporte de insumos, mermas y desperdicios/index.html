<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reportes | Imperio</title>
  <link rel="stylesheet" href="estilos.css">
  <script defer src="../compartido/usuarios.js"></script>
  <script defer src="../compartido/sesion.js"></script>
  <script defer src="../compartido/navegacion.js"></script>
  <script defer src="../compartido/operaciones.js"></script>
  <script defer src="../compartido/pantallas.js"></script>
  <script defer src="script.js"></script>
</head>
<body data-modulo="reportes">
  <aside class="barraLateral"></aside>
  <main>
    <div id="reportePantalla">
      <header>
        <div>
          <h1>Reportes de inventario</h1>
          <p class="subtitulo">Consulta entradas, salidas y mermas por período.</p>
        </div>
        <div class="accionesReporte">
          <button type="button" id="exportar" disabled>Descargar CSV</button>
          <button type="button" id="imprimir" disabled>Imprimir o guardar PDF</button>
        </div>
      </header>
      <p id="mensajeEstado" role="status" aria-live="polite"></p>
      <section class="tarjeta" aria-label="Filtros">
        <form id="filtros" class="filtrosReporte">
          <label>Tipo de reporte
            <select id="reporte">
              <option value="todos">Movimientos generales</option>
              <option value="entrada">Entradas de insumos</option>
              <option value="salida">Salidas de insumos</option>
              <option value="merma">Mermas y desperdicios</option>
            </select>
          </label>
          <label>Desde<input id="desde" type="date"></label>
          <label>Hasta<input id="hasta" type="date"></label>
          <button id="filtrar" class="primario">Aplicar filtros</button>
        </form>
      </section>
      <div id="indicadores" class="indicadores resumenReporte"></div>
      <section class="resultados" aria-labelledby="tituloResultados">
        <div class="encabezadoResultados">
          <h2 id="tituloResultados">Movimientos generales</h2>
          <span id="rangoResultados"></span>
        </div>
        <div class="contenedorTabla"><table id="tabla"></table></div>
        <div class="paginacion" aria-label="Paginación">
          <span id="pagina" aria-live="polite"></span>
          <div>
            <button type="button" id="anterior" disabled>Anterior</button>
            <button type="button" id="siguiente" disabled>Siguiente</button>
          </div>
        </div>
      </section>
    </div>
    <section id="reporteImpresion" aria-labelledby="tituloImpresion">
      <div class="cabeceraImpresion">
        <img src="../compartido/logo-imperio.png" alt="Imperio Clamatos &amp; Snacks" width="1164" height="296">
        <h1 id="tituloImpresion"></h1>
        <p id="periodoImpresion"></p>
      </div>
      <div id="resumenImpresion"></div>
      <table id="tablaImpresion"></table>
    </section>
  </main>
</body>
</html>
