<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Imperio</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="../compartido/sesion.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="pantalla">
    <aside class="panelMarca" aria-label="Imperio Clamatos y Snacks">
      <div class="identidad">
        <img class="logo" src="../compartido/logo-imperio.png" alt="Imperio Clamatos &amp; Snacks" width="1164" height="296">
        <p class="descripcionSistema">Sistema de inventario</p>
      </div>
    </aside>
    <section class="panelAcceso" aria-labelledby="tituloAcceso">
      <div class="contenedorFormulario">
        <h1 id="tituloAcceso">Iniciar sesión</h1>
        <p class="introduccion">Accede al inventario con tu cuenta de Imperio.</p>
        <form id="formularioAcceso">
          <div class="grupoCampo">
            <label for="campoUsuario">Correo</label>
            <input id="campoUsuario" name="correo" type="email" placeholder="Ej. monica@correo.com"
              autocomplete="username" required aria-describedby="mensajeEstado">
          </div>
          <div class="grupoCampo">
            <label for="campoContrasena">Contraseña</label>
            <div class="campoClave">
              <input id="campoContrasena" name="contrasena" type="password" placeholder="••••••••"
                autocomplete="current-password" required aria-describedby="mensajeEstado">
              <button id="verContrasena" type="button" aria-controls="campoContrasena"
                aria-pressed="false" aria-label="Mostrar contraseña" title="Mostrar contraseña">
                <span class="iconoOjo" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div class="acciones">
            <button id="botonIniciar" class="boton botonIniciar" type="submit">Iniciar sesión</button>
            <button id="botonCancelar" class="boton botonCancelar" type="button">Cancelar</button>
          </div>
          <p id="mensajeEstado" class="mensajeEstado" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
