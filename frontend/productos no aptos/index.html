<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mermas y desperdicios | Imperio</title><link rel="stylesheet" href="estilos.css"><script defer src="../compartido/usuarios.js"></script><script defer src="../compartido/sesion.js"></script><script defer src="../compartido/navegacion.js"></script><script defer src="../compartido/operaciones.js"></script><script defer src="../compartido/pantallas.js"></script><script defer src="script.js"></script></head><body data-modulo="mermas"><aside class="barraLateral"></aside><main><header><h1>Mermas y desperdicios</h1></header><p id="mensajeEstado" role="status" aria-live="polite"></p><div class="distribucionMerma"><section class="tarjeta captura"><h2>Registrar merma o producto no apto</h2><form id="formulario"><div class="campos"><label>Producto<select id="producto"></select></label><label>Cantidad<input id="cantidad" type="number" min="0.01" step="0.01" placeholder="0" required></label><label>Unidad<input id="unidad" readonly></label><label>Tipo de baja<select id="tipoBaja"><option value="Caducidad">Caducidad</option><option value="Daño">Daño</option><option value="Otros">Otros</option></select></label><label>Fecha<input id="fecha" type="date" required></label><label>Descripción<input id="descripcion" type="text" placeholder="Opcional" maxlength="160"></label></div><p id="disponible" class="ayuda"></p><div class="acciones"><button class="primario" type="submit">Registrar merma</button><button id="cancelar" type="button">Cancelar</button></div></form></section><section id="panelDuena" hidden><h2>Resumen del mes</h2><div class="indicadores"><article class="indicador"><span>Total mermas</span><strong id="totalMermas">0</strong></article><article class="indicador"><span>Por caducidad</span><strong id="caducidad">0</strong></article><article class="indicador"><span>Por daño</span><strong id="dano">0</strong></article><article class="indicador"><span>Otros</span><strong id="otros">0</strong></article></div><h2>Historial de mermas</h2><div class="contenedorTabla"><table id="tabla"></table></div></section></div></main></body></html>
